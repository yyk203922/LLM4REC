# Replace local paths and dataset names with your own LLaMA-Factory setup.
model_name_or_path: OpenOneRec/OneReason-0.8B-pretrain-competition
trust_remote_code: true
flash_attn: fa2

stage: sft
do_train: true
finetuning_type: lora
enable_liger_kernel: true
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

# Earlier SID levels receive stronger supervision because every later decision
# is conditioned on the generated prefix.
sid_loss_weight:
  default: 1.0
  domain: 1.0
  s_a: 5.0
  s_b: 3.0
  s_c: 1.0

dataset: material_sid_curriculum,user_sft,compact_recommendation_cot
dataset_dir: data
template: qwen3_nothink
cutoff_len: 32768
packing: true
neat_packing: true
overwrite_cache: true
preprocessing_num_workers: 4

output_dir: outputs/sid_weighted_lora
logging_steps: 10
save_strategy: steps
save_steps: 256
save_total_limit: 2
report_to: none

num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.001
bf16: true
pure_bf16: true
gradient_checkpointing: true
seed: 20260703
