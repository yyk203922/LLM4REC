[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4rec-sid-training"
version = "0.1.0"
description = "Prefix-aware hierarchical SID post-training for LLM recommendation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.45",
  "peft>=0.12",
  "pyarrow>=15",
  "pyyaml>=6",
]

[project.optional-dependencies]
train = ["liger-kernel>=0.5"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
